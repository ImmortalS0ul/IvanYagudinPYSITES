<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Таблица</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
      color: #333;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      background-color: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f1f1;
      transition: background-color 0.3s ease;
    }

    a {
      color: #1976D2;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
      color: #0D47A1;
    }

    p {
      margin: 10px 0;
      font-size: 16px;
    }

    .auth-info {
      margin-bottom: 20px;
      padding: 15px;
      background-color: #e8f5e8;
      border-left: 4px solid #4CAF50;
      border-radius: 2px;
    }

    .nav-links {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .nav-links a {
      padding: 8px 16px;
      background-color: #2196F3;
      color: white;
      border-radius: 4px;
    }

    .nav-links a:hover {
      background-color: #0B7BCA;
      text-decoration: none;
    }
  </style>
</head>
<body>
  {% if user %}
    <p>вы авторизовались как {{user.login}}!</p>
    <br>
    <a href="/logout">Выйти</a>
  {% else %}
    <p>вы не авторизовались</p>
    <a href="/reg_form">Регистрация</a><br>
    <a href="/login_form">авторизация</a><br>
  {% endif %}
  <a href="/add_form">добавление</a><br>
  <table>
    <tr>
      <th>Название</th>
      <th>Жанр</th>
      <th>Режисёр</th>
      <th>id</th>
    </tr>
    {% for kid in films %}
    <tr>
      <td>{{ kid.name }}</td>
      <td>{{ kid.janr }}</td>
      <td>{{ kid.avt }}</td>
      <td><a href="/film/{{ kid.id }}">подробнее про фильм</a></td>
    </tr>
    {% endfor %}
  </table>
</body>
<footer style="
  margin-top: 40px;
  padding: 20px;
  background-color: #4CAF50;
  color: white;
  text-align: center;
  font-size: 14px;
  border-radius: 4px;
">
  <p>© Ягудин Иван</p>
</footer>

</html>
